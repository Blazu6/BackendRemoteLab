<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Lab - Połączenie</title>
  <style>
    #display { display: block; overflow: hidden; background: #000; }
    #display canvas { display: block; }
  </style>
</head>

<body>
  <h2>Parametry Połączenia</h2>

  <form id="connect-form">
    <div class="field">
      <label>Protokół:</label>
      <select id="protocol">
        <option value="ssh" selected>SSH</option>
      </select>
    </div>
    <div class="field">
      <label>Host IP:</label>
      <input type="text" id="hostname" value="172.17.0.1">
    </div>
    <div class="field">
      <label>Port:</label>
      <input type="number" id="port" value="22">
    </div>
    <div class="field">
      <label>Użytkownik:</label>
      <input type="text" id="username" placeholder="np. blazu">
    </div>
    <div class="field">
      <label>Hasło:</label>
      <input type="password" id="password">
    </div>
    <button type="submit">Połącz</button>
  </form>
  <div id="display"></div>

  <script type="module" src="/src/main.js"></script>

</body>
